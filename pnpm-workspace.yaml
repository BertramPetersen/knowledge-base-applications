packages:
  - core
  - desktop
  - mobile

allowBuilds:
  esbuild: set this to true or false

# esbuild fetches its native binary in a postinstall; pnpm blocks build scripts
# by default, so it must be allowed explicitly or vite cannot build.
onlyBuiltDependencies:
  - esbuild

# The esbuild binary ships as an optional dep and needs no postinstall, so the
# ignored-build warning is harmless — but it makes pnpm's pre-run check fail and
# block every script. Skip the check rather than the build.
verifyDepsBeforeRun: false
