packages:
  - core
  - desktop
  - mobile

# esbuild runs a postinstall to place its native binary. pnpm blocks build
# scripts unless a package is named here, and since pnpm 11 an unapproved one is
# an install *error*, not a warning — which is why a clean CI checkout failed
# where the incrementally-grown local one did not.
allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - esbuild

# The esbuild binary also ships as an optional dep, so pnpm's pre-run dependency
# check can consider the tree incomplete and refuse to run any script. Skip the
# check rather than the build.
verifyDepsBeforeRun: false
